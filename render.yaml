services:
  - type: web
    name: erzh-gaoxin-enrollment
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER_DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
